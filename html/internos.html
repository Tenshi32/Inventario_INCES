<main class="dashboard-content">
  <div class="container-fluid px-3 px-lg-4 py-4">
    <div class="page-heading">
      <div class="page-heading-copy">
        <span class="page-icon"><i class="bi bi-person-badge" aria-hidden="true"></i></span>
        <div>
          <p class="eyebrow mb-1">Management</p>
          <h1 class="h3 mb-1">Internos</h1>
        </div>
      </div>
      <div class="heading-actions">
        <a class="btn btn-outline-secondary btn-sm" href="tables.html">
          <i class="bi bi-download" aria-hidden="true"></i> Export
        </a>
      </div>
    </div>

    <section class="row g-4 mb-4">
      <div class="col-sm-6 col-xl-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body p-3 p-xl-4 d-flex align-items-center justify-content-between">
            <div>
              <p class="text-muted small fw-medium text-uppercase mb-1">Total</p>
              <h2 class="fw-bold my-1" id="totalDevice">0</h2>
              <p class="text-muted small mb-0"><i class="bi bi-layers me-1"></i> Usuarios registrados</p>
            </div>
            <div
              class="rounded-circle bg-primary-subtle text-primary p-3 d-flex align-items-center justify-content-center"
              style="width: 52px; height: 52px;">
              <i class="bi bi-person-badge fs-4"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Operativos -->
      <div class="col-sm-6 col-xl-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body p-3 p-xl-4 d-flex align-items-center justify-content-between">
            <div>
              <p class="text-muted small fw-medium text-uppercase mb-1">ACTIVOS</p>
              <h2 class="fw-bold my-1 text-success" id="operativoCount">0</h2>
              <p class="text-muted small mb-0"><i class="bi bi-check-circle me-1"></i> Usuarios con Equipo</p>
            </div>
            <div
              class="rounded-circle bg-success-subtle text-success p-3 d-flex align-items-center justify-content-center"
              style="width: 52px; height: 52px;">
              <i class="bi bi-check2-square fs-4"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Inoperativos -->
      <div class="col-sm-6 col-xl-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body p-3 p-xl-4 d-flex align-items-center justify-content-between">
            <div>
              <p class="text-muted small fw-medium text-uppercase mb-1">INACTIVOS</p>
              <h2 class="fw-bold my-1 text-warning" id="inoperativoCount">0</h2>
              <p class="text-muted small mb-0"><i class="bi bi-exclamation-triangle me-1"></i> Usuarios sin Equipo</p>
            </div>
            <div
              class="rounded-circle bg-warning-subtle text-warning p-3 d-flex align-items-center justify-content-center"
              style="width: 52px; height: 52px;">
              <i class="bi bi-exclamation-diamond fs-4"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Último Registro -->
      <div class="col-sm-6 col-xl-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body p-3 p-xl-4 d-flex align-items-center justify-content-between">
            <div>
              <p class="text-muted small fw-medium text-uppercase mb-1">Último Registro</p>
              <h2 class="fw-bold my-1" id="lastId">-</h2>
              <p class="text-muted small mb-0"><i class="bi bi-clock-history me-1"></i> Cedula más reciente</p>
            </div>
            <div class="rounded-circle bg-info-subtle text-info p-3 d-flex align-items-center justify-content-center"
              style="width: 52px; height: 52px;">
              <i class="bi bi-tag fs-4"></i>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="card border-0 shadow-sm mb-4 p-4">
      <div
        class="card-header bg-transparent border-0 pt-4 px-4 d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3">

        <div class="d-flex flex-column flex-sm-row align-items-stretch align-items-sm-center gap-2 w-100 w-md-auto" id="DivInterno">
          <div class="position-relative flex-grow-1">

            <input type="search" id="searchTable" class="form-control ps-5" placeholder="Buscar...">

            <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
          </div>
          <button class="btn btn-primary px-4 text-nowrap" id="openCreate">
            <i class="bi bi-plus-lg"></i> Nuevo Interno
          </button>
        </div>
      </div>

      <div class="card-body p-0">
        <div class="table-responsive">
          <table id="MyTable" class="table table-hover align-middle mb-0 text-nowrap">
            <thead class="border-bottom border-gray-200">
              <tr class="text-uppercase fs-7 fw-bold text-muted">
                <th class="ps-4 py-3" style="letter-spacing: 0.5px;">Cedula/Rif</th>
                <th class="py-3">Nombre</th>
                <th class="py-3">Apellido</th>
                <th class="py-3">Correo</th>
                <th class="py-3">Cargo</th>
                <th class="py-3 ">Telefono</th>
                <th class="pe-4 py-3 text-end" style="width: 80px;">Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaInterno" class="border-top-0">
            </tbody>
          </table>
        </div>
      </div>

    </section>

    <div class="modal fade" id="InternoModal" tabindex="-1" aria-labelledby="InternoModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
          <div class="modal-header border-bottom px-4">
            <div>
              <h5 class="modal-title fw-bold" id="ModalLabel"></h5>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body p-4">
            <form id="formInterno" class="row g-3">

              <div class="col-12 d-flex justify-content-between align-items-center mb-0">
                <span class="badge bg-danger-subtle text-danger border border-danger-subtle px-3 py-2 rounded-pill">
                  <i class="bi bi-exclamation-circle me-1"></i> Los campos con
                  (*) son obligatorios
                </span>
              </div>

              <input type="hidden" id="created" name="created">

              <div class="col-md-6">
                <div class="form-group">
                  <label class="form-label fw-semibold small">Buscar Usuario (Cedula)<span
                      class="text-danger h5">*</span></label>
                  <div class="input-group">
                    <input class="form-control" id="id_usuario" name="id_usuario" placeholder="Ej: 29772294">
                    <button class="btn btn-primary px-3 text-nowrap" id="SearchUser" type="button"
                      onclick="BuscarUsuario()">
                      <i class="bi bi-search"></i> Buscar
                    </button>
                  </div>
                </div>
              </div>

              <div class="col-md-6" id="datosUsuario"></div>

              <div class="col-md-6" id="passwordFields">
                <div class="form-group">
                  <label class="form-label fw-semibold small">Contraseña <span class="text-danger h5">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock" id="toggleLockdIcon"></i></span>
                    <input class="form-control" id="password" name="password" placeholder="Ej. SN123456" required>
                    <span class="btn btn-outline-secondary border" id="togglePassword">
                      <i class="bi bi-eye" id="togglePasswordIcon"></i>
                    </span>
                  </div>
                </div>
              </div>

              <div class="col-md-6" id="passwordConfirmFields">
                <div class="form-group">
                  <label class="form-label fw-semibold small">Confirmar Contraseña <span
                      class="text-danger h5">*</span></label>
                  <input class="form-control" id="passwordConfirm" name="passwordConfirm" placeholder="Ej. SN123456">
                </div>
              </div>

              <div class="col-md-6">
                <div class="form-group">
                  <label class="form-label fw-semibold small">Rol del Interno <span
                      class="text-danger h5">*</span></label>
                  <select id="id_rol_interno" name="id_rol_interno" class="form-select" required>
                    <option value="1">Visor</option>
                    <option value="2">Técnico</option>
                    <option value="3">Administrador</option>
                  </select>
                </div>
              </div>

              <div class="col-12 d-flex justify-content-end gap-2 pt-3 border-top mt-4">
                <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary px-4" id="buttomMaster">Guardar Interno</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

  </div>
</main>

<script src="../assets/js/pages/internos.js"></script>
